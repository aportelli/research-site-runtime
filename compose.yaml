services:
  site:
    # `build` is convenient locally; deployment stacks can use only `image`.
    build: .
    image: research-site-runtime:local
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      GITSYNC_REPO: ${GITSYNC_REPO:?set the target HTTPS Git URL}
      GITSYNC_REF: ${GITSYNC_REF:?set the target branch or ref}
      GITSYNC_PERIOD: ${GITSYNC_PERIOD:-60s}
      GITSYNC_USERNAME: ${GITSYNC_USERNAME:-}
      GITSYNC_PASSWORD: ${GITSYNC_PASSWORD:-}
    volumes:
      - content:/content
      - site:/site
      - cache:/cache

volumes:
  # Keep Git worktrees, rendered releases, and the app cache across restarts.
  content:
  site:
  cache:
